name: SellerFlow AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 apps/api --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal
          flake8 apps/api --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Run Test Suite (Unit, Integration, Security)
        env:
          PYTHONPATH: apps/api
        run: |
          python -m pytest tests/ -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint Frontend
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Production App
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.sellerflow.ai

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Leaked Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
