version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sellerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellerflow
      POSTGRES_USER: sellerflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellerflow_user -d sellerflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sellerflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-sellerflow_redis_secret}
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: sellerflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://sellerflow_user:${POSTGRES_PASSWORD}@db:5432/sellerflow
      REDIS_URL: redis://:${REDIS_PASSWORD:-sellerflow_redis_secret}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_DIR: /app/storage/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: sellerflow-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage_uploads:
