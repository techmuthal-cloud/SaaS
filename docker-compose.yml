version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sellerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellerflow
      POSTGRES_USER: sellerflow_user
      POSTGRES_PASSWORD: sellerflow_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellerflow_user -d sellerflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sellerflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: sellerflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sellerflow_user:sellerflow_password_change_me@db:5432/sellerflow
      JWT_SECRET_KEY: change-me-in-production-sellerflow-key-2026
      STORAGE_DIR: /app/storage/uploads
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: sellerflow-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage_uploads:
